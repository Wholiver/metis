          <path d="M-10.5 -11.5A10.5 10.5 0 0 1 0 -22A10.5 10.5 0 0 1 10.5 -11.5V11.5A10.5 10.5 0 0 1 0 22A10.5 10.5 0 0 1 -10.5 11.5Z" transform="matrix(0.98 -0.09 0.08 0.99 -13.89 -7.77)" fill="#F0EEE6"/>
          <path d="M-10.5 -11.5A10.5 10.5 0 0 1 0 -22A10.5 10.5 0 0 1 10.5 -11.5V11.5A10.5 10.5 0 0 1 0 22A10.5 10.5 0 0 1 -10.5 11.5Z" transform="matrix(0.92 -0.03 0.08 0.99 29.33 -10.09)" fill="#F0EEE6"/>
        </g>
      </g>

      <!-- Brand Typography (Monospace Geist-style) -->
      <text x="-40" y="20" font-family="'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="600" fill="#171718" letter-spacing="-0.03em">
        metis
      </text>

      <!-- Technical Architecture Badge -->
      <g transform="translate(22, 4)">
        <rect x="0" y="0" width="56" height="20" rx="4" fill="#FFFFFF" stroke="rgba(23, 23, 24, 0.12)" stroke-width="1"/>
        <text x="28" y="14" text-anchor="middle" font-family="'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" fill="#73716B" letter-spacing="0.02em">
          macOS
        </text>
      </g>
    </g>

    <!-- Subtitle Line: Standard Natural Chinese & English Installation Copy -->
    <text x="330" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Geist', 'SF Pro Text', 'PingFang SC', sans-serif" font-size="12.5" font-weight="400" fill="#73716B">
      拖拽 Metis 到 应用程序 完成安装  ·  Drag Metis into Applications to install
    </text>
  </g>

  <!-- ==================== CENTER ARCHITECTURAL CONNECTOR ==================== -->
  <g transform="translate(330, 175)">
    <!-- Clean Continuous Engineering Guideline -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="rgba(23, 23, 24, 0.22)" stroke-width="1.5"/>
    
    <!-- Sharp Vector Arrowhead -->
    <path d="M 72 -5 L 82 0 L 72 5" stroke="rgba(23, 23, 24, 0.45)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Subtle Centered Drag Cue (Bilingual & Clean) -->
    <g transform="translate(0, -14)">
      <text x="0" y="0" text-anchor="middle" font-family="'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="500" fill="#9CA3AF" letter-spacing="0.08em">
        DRAG &amp; DROP
      </text>
    </g>
  </g>

  <!-- ==================== BOTTOM TROUBLESHOOTING GUIDE ==================== -->
  <g transform="translate(330, 292)">
    <!-- Clear, Highly Readable Troubleshooting Badge -->
    <rect x="-120" y="-12" width="240" height="24" rx="4" fill="#FFFFFF" stroke="rgba(23, 23, 24, 0.12)" stroke-width="1" filter="url(#cardShadow)"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#3C3B38" letter-spacing="0.02em">
      [ 打不开？请看排障指南 · Troubleshooting ]
    </text>

    <!-- Subtle Hairline Pointer -->
    <line x1="0" y1="13" x2="0" y2="24" stroke="rgba(23, 23, 24, 0.22)" stroke-width="1"/>
    <path d="M -3 21 L 0 24 L 3 21" stroke="rgba(23, 23, 24, 0.28)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
