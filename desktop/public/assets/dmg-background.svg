<svg xmlns="http://www.w3.org/2000/svg" width="660" height="480" viewBox="0 0 660 480" fill="none">
  <defs>
    <!-- Metis Web Signature Graph Paper Grid -->
    <pattern id="gridMinor" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="rgba(23, 23, 24, 0.024)" stroke-width="0.75"/>
    </pattern>
    <pattern id="gridMajor" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="url(#gridMinor)"/>
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(23, 23, 24, 0.055)" stroke-width="1"/>
    </pattern>

    <!-- Subtle Elevation -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#171718" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Base Paper Background -->
  <rect width="660" height="480" fill="#FBFBFA"/>

  <!-- Graph Paper Grid Overlay -->
  <rect width="660" height="480" fill="url(#gridMajor)"/>

  <!-- Perimeter Hairline Border -->
  <rect x="0.5" y="0.5" width="659" height="479" stroke="rgba(23, 23, 24, 0.08)" stroke-width="1" fill="none"/>

  <!-- ==================== HEADER: METIS BRAND & ARCHITECTURE ==================== -->
  <g transform="translate(0, 32)">
    <!-- Brand Row: Centered Mascot + Brand Name + macOS Badge -->
    <g transform="translate(330, 0)">
      <!-- Metis Mascot Icon (-78px from center) -->
      <g transform="translate(-78, 0)">
        <rect x="0" y="0" width="28" height="28" rx="6" fill="#F0EEE6" stroke="rgba(23, 23, 24, 0.1)" stroke-width="1"/>
        <g transform="translate(14, 14) scale(0.11)">
