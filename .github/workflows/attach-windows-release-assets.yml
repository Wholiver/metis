name: Attach Windows release assets

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Actions run ID that produced Windows artifacts
        required: true
      tag:
        description: GitHub release tag (e.g. v1.3.2)
        required: true

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          name: metis-windows-x64-portable
          path: portable
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          name: metis-windows-x64-installer
          path: installer
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lah portable installer
          # Install binaries only — do not upload companion .sha256 checksum files.
          mapfile -t files < <(find portable installer -type f ! -name '*.sha256' | sort)
          test "${#files[@]}" -gt 0
          gh release upload "${{ inputs.tag }}" "${files[@]}" --clobber --repo "${{ github.repository }}"
          gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
